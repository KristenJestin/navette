[package]
name = "navette"
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[[bin]]
name = "navette"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6", features = ["derive", "env"] }
hkdf = "0.12"
hmac = "0.12"
opus = "0.4"
pipewire = { version = "0.10", features = ["v0_3_49"] }
rand = "0.8"
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "logging"] }
sha2 = "0.10"
spake2 = "0.4"
tokio = { version = "1.53", features = ["io-util", "macros", "net", "rt", "rt-multi-thread", "signal", "sync", "time"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }

[dev-dependencies]
tempfile = "3"
