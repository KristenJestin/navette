[package]
name = "navette"
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[[bin]]
name = "navette"
path = "src/main.rs"

[dependencies]
bytes = "1"
clap = { version = "4.6", features = ["derive", "env"] }
gliff-proto = { git = "https://github.com/KristenJestin/navette-gliff", rev = "a2edd505f9868a0f3299eada3ddfbc342b0da0a7" }
gliff-transport = { git = "https://github.com/KristenJestin/navette-gliff", rev = "a2edd505f9868a0f3299eada3ddfbc342b0da0a7" }
hkdf = "0.12"
hmac = "0.12"
hypr-input = { git = "https://github.com/KristenJestin/navette-gliff", rev = "a2edd505f9868a0f3299eada3ddfbc342b0da0a7" }
minicbor = { version = "2", features = ["derive", "alloc"] }
rand = "0.8"
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "logging"] }
sha2 = "0.10"
spake2 = "0.4"
tokio = { version = "1.53", features = ["io-util", "macros", "net", "rt", "rt-multi-thread", "sync", "time"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }

[dev-dependencies]
tempfile = "3"
