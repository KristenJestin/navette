name: ci

on:
  pull_request:
    # `edited`: a title fixed after a failed check is checked again (a re-run replays the old title).
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main, dev]
  workflow_dispatch:

jobs:
  commit-messages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # The first push of a branch has no `before` (forty zeros): every commit it holds is checked.
      - name: Check the Angular commit convention
        run: |
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          head="${{ github.event.pull_request.head.sha || github.sha }}"
          if [ -z "${base//0/}" ]; then
            tools/commit-message.sh --range "$head"
          else
            tools/commit-message.sh --range "$base..$head"
          fi
      # A pull request is squashed: its title, with " (#<number>)" appended, becomes the commit subject.
      - name: Check the title of the pull request
        if: github.event_name == 'pull_request'
        env:
          TITLE: ${{ github.event.pull_request.title }}
          NUMBER: ${{ github.event.pull_request.number }}
        run: |
          printf '%s\n' "$TITLE" > "$RUNNER_TEMP/title"
          tools/commit-message.sh --pull-request "$NUMBER" "$RUNNER_TEMP/title"

  # No Hyprland, no PipeWire and no second machine here: the suites run against fakes (see AGENTS.md, Testing).
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: tools/install-build-libraries.sh
      - run: rustup component add rustfmt clippy
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked

  # TEMPORARY (#140): the three flaky tests, looped under CPU load. Removed before the merge.
  stress:
    if: false
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        suite: [audio, cli]
    steps:
      - uses: actions/checkout@v4
      - run: tools/install-build-libraries.sh
      - run: cargo test --locked --no-run
      - name: Loop under load
        run: |
          ulimit -n 65536
          for _ in $(seq "$(nproc)"); do (while :; do :; done) & done
          if [ "${{ matrix.suite }}" = cli ]; then
            # Socket churn in the same network namespace, as the other tests make.
            python3 - <<'PY' &
          import socket, threading
          srv = socket.socket(); srv.bind(("127.0.0.1", 0)); srv.listen(4096)
          port = srv.getsockname()[1]
          kept = []
          def accept():
              while True:
                  c = srv.accept()[0]
                  if len(kept) < 3000:
                      kept.append(c)
                  else:
                      c.close()
          threading.Thread(target=accept, daemon=True).start()
          # A big table: thousands of established sockets, so that reading it takes many read()s.
          held = [socket.create_connection(("127.0.0.1", port)) for _ in range(3000)]
          def churn():
              while True:
                  socket.create_connection(("127.0.0.1", port)).close()
          for _ in range(3):
              threading.Thread(target=churn, daemon=True).start()
          churn()
          PY
          fi
          if [ "${{ matrix.suite }}" = audio ]; then
            args=(--lib -- audio::mic::tests --test-threads=32)
          else
            args=(--test cli -- --test-threads=16)
          fi
          fail=0
          for i in $(seq 20); do
            if ! out=$(cargo test --locked "${args[@]}" 2>&1); then
              fail=$((fail + 1))
              echo "== iteration $i"
              echo "$out" | grep -E "FAILED|panicked|left:|right:|established|never got" | head -20
            fi
          done
          echo "failed iterations: $fail of 20"
          [ "$fail" = 0 ]

  tcpdup:
    runs-on: ubuntu-latest
    steps:
      - name: Does reading /proc/net/tcp under churn repeat a socket?
        run: |
          ulimit -n 65536
          python3 - <<'PY'
          import os, socket, threading, time
          srv = socket.socket(); srv.bind(("127.0.0.1", 0)); srv.listen(4096)
          port = srv.getsockname()[1]
          kept = []
          def accept():
              while True:
                  c = srv.accept()[0]
                  if len(kept) < 3000:
                      kept.append(c)
                  else:
                      c.close()
          threading.Thread(target=accept, daemon=True).start()
          held = [socket.create_connection(("127.0.0.1", port)) for _ in range(3000)]
          def churn():
              while True:
                  socket.create_connection(("127.0.0.1", port)).close()
          for _ in range(3):
              threading.Thread(target=churn, daemon=True).start()
          # Reads like Rust's read_to_string on a proc file: a small probe, then growing chunks.
          def chunked():
              fd = os.open("/proc/net/tcp", os.O_RDONLY)
              out, size = b"", 32
              while True:
                  chunk = os.read(fd, size)
                  if not chunk:
                      break
                  out += chunk
                  size = min(size * 2, 8192)
              os.close(fd)
              return out.decode().splitlines()[1:]
          # The whole table in one read(): one pass of the kernel's iterator.
          def whole():
              fd = os.open("/proc/net/tcp", os.O_RDONLY)
              out = os.read(fd, 1 << 24)
              assert len(out) < (1 << 24) - 1
              os.close(fd)
              return out.decode().splitlines()[1:]
          mine = {str(os.fstat(s.fileno()).st_ino) for s in held}
          for name, table in (("chunked", chunked), ("whole", whole)):
              dup = missing = reads = 0
              end = time.time() + 60
              while time.time() < end:
                  rows = [r.split() for r in table()]
                  reads += 1
                  inodes = [r[9] for r in rows if r[3] == "01" and r[9] != "0"]
                  if len(inodes) != len(set(inodes)):
                      dup += 1
                  if not mine <= set(inodes):
                      missing += 1
              print(f"{name}: reads {reads}, with a repeated socket {dup}, with a held socket missing {missing}")
          PY
