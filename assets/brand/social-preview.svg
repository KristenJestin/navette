<text x="640" y="236" text-anchor="middle" font-family="Figtree" font-size="25" fill="#a39b8c">The work-from-home mode: drive the work laptop from the home desk, unplugging nothing.</text>
<rect x="96" y="290" width="1088" height="400" rx="18" fill="#131b21" stroke="#223039" stroke-width="2"/>
